/* Layout concept: a fixed, illustrated Vienna skyline (Stephansdom, Rathaus, Riesenrad, a red tram) fills the
   background. A sparse tile grid floats over it, and the clues sit in a frosted side panel. */
:root {
  --f-display: "Federo", "Georgia", serif;
  --f-ui: "Josefin Sans", "Trebuchet MS", system-ui, sans-serif;

  /* page + puzzle */
  --bg: #DCE9F4;

  --panel-line: #B9C6DE;

  --cell: #FFFFFF;
  --cell-ink: #1A2340;
  --cell-line: #46557E;
  --cell-num: #44527A;
  --clue-active: #9A5200;
  --board: rgba(20, 30, 64, 0.66);
  --board-line: rgba(255, 255, 255, 0.4);
  --cell-word: #FFE9A3;
  --cell-cur: #F6C324;
  --cur-ink: #1A2340;
  --ok: #14764A;
  --ok-bg: #D5F0E2;
  --bad: #B3261E;
  --bad-bg: #FBD7D3;
  --rev: #2956A8;
  --accent: #C8102E;
  --accent-ink: #FFFFFF;

  /* skyline */
  --sky-top: #9CC7E6;
  --sky-bot: #FCE6B0;
  --glow: #FFD98A;
  --sun: #FFF6D6;
  --star-a: 0;

  --cabin: #C8102E;

  --river: #6FA4CF;
  --river-deep: #3F78AA;
  --win: #9FB1D0;

}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
#snow { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: block; }
#fireworks { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; display: block; }
#sky {
  position: fixed;
  left: 0;
  bottom: 0;
  z-index: 0;
  pointer-events: none;
  display: block;
}
.page { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; }

/* hero */
.hero { padding-block: 6px 18px; }
.hero h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(32px, 6vw, 56px);
  line-height: 1.05;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.hero .sub { margin: 8px 0 0; font-size: 21px; color: var(--clue-active); max-width: 46ch; font-weight: 700; }
.hero .meta { margin: 6px 0 0; font-size: 14px; color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, auto) minmax(320px, 1fr); gap: 20px; align-items: start; }
.board { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.frost {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 14px;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.bar { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.now { margin: 0; min-height: 2.8em; font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.now b { font-family: var(--f-display); font-weight: 400; font-size: 1.15em; white-space: nowrap; }
.now .len { color: var(--ink-soft); font-weight: 400; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  font: inherit;
  font-weight: 700;
  font-size: 15px;
  min-height: 42px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1.5px solid var(--ink);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
.btn.armed { background: var(--cell-cur); color: var(--cur-ink); border-color: var(--cur-ink); }
.btn:focus-visible, .clue:focus-visible { outline: 3px solid var(--cell-cur); outline-offset: 2px; }
.status { margin: 0; font-size: 15px; color: var(--ink-soft); min-height: 1.4em; font-weight: 600; }
.hint { margin: 0; font-size: 13.5px; color: var(--ink-soft); padding: 8px 12px; border-radius: 10px; }

/* grid */
.gridwrap { overflow-x: auto; max-width: 100%; width: fit-content; padding: 10px; background: var(--board); border: 1px solid var(--board-line); border-radius: 14px; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); box-shadow: 0 6px 22px rgba(10, 16, 40, 0.28); }
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--cs));
  grid-auto-rows: var(--cs);
  gap: 2px;
  width: max-content;
  padding: 2px;
  --cs: 30px;
}
.cell {
  position: relative;
  border: 1px solid var(--cell-line);
  border-radius: 3px;
  background: var(--cell);
  color: var(--cell-ink);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  display: grid;
  place-items: center;
  font-family: var(--f-ui);
  font-weight: 700;
  font-size: calc(var(--cs) * 0.56);
  line-height: 1;
  touch-action: manipulation;
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.25);
}
.cell.blank { visibility: hidden; pointer-events: none; }
.cell .n {
  position: absolute;
  top: 1px;
  left: 2px;
  font-size: max(8px, calc(var(--cs) * 0.3));
  font-weight: 700;
  color: var(--cell-num);
  line-height: 1;
  pointer-events: none;
}
.cell .l { pointer-events: none; }
.cell.inword { background: var(--cell-word); }
.cell.ok { background: var(--ok-bg); color: var(--ok); }
.cell.bad { background: var(--bad-bg); color: var(--bad); }
.cell.rev { color: var(--rev); }
.cell.cur { background: var(--cell-cur); color: var(--cur-ink); border-color: var(--cur-ink); }
.cell.cur .n { color: var(--cur-ink); }

/* clues */
.clues { padding: 14px; position: sticky; top: 16px; display: flex; flex-direction: column; min-width: 0; }
.lists { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.list { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.list h2 {
  margin: 0 0 6px;
  padding-bottom: 6px;
  font-family: var(--f-display);
  font-weight: 400;
  font-size: 22px;
  border-bottom: 1.5px solid var(--panel-line);
}
.scroll { overflow-y: auto; max-height: 300px; margin: 0; padding: 0; list-style: none; }
.clue {
  display: grid;
  grid-template-columns: 2.1em 1fr auto;
  gap: 6px;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: 15.5px;
  color: inherit;
  background: transparent;
  border: 0;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
}
.clue:hover { background: var(--hover); }
.clue .num { font-weight: 700; }
.clue .len { color: var(--ink-soft); font-size: 0.88em; white-space: nowrap; }
.clue.cross { box-shadow: inset 0 0 0 1.5px var(--cell-cur); }
.clue.active .text, .clue.active .num { color: var(--clue-active); font-weight: 700; }
.clue.filled .text { color: var(--ink-soft); }
.clue.filled .text::after { content: " \2713"; color: var(--ok); font-weight: 700; }

.kb { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; pointer-events: none; }

@media (max-width: 1099px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .clues { position: static; max-height: none; }
  .scroll { max-height: 420px; }
}
@media (max-width: 639px) {
  .lists { grid-template-columns: minmax(0, 1fr); }
  .scroll { max-height: 320px; }
  .hero .sub { font-size: 18px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn { transition: background 0.15s ease, filter 0.15s ease; }
}
</style>

<div class="page">

    <h1>Vienna Christmas Crossword</h1>
    <p class="sub">Click on the crossword or the clue list to select a word</p>
  </header>

  <div class="layout">
    <section class="board" aria-label="Crossword grid">

      </div>
      <div class="gridwrap"><div class="grid" id="grid" role="group" aria-label="Crossword squares"></div></div>
      <p class="hint frost">Arrow keys move between squares. Tab jumps to the next clue, Enter flips direction, Esc leaves the grid.</p>
    </section>

        <section class="list" aria-labelledby="h-down">
          <h2 id="h-down">Down</h2>
          <ol class="scroll" id="list-D"></ol>
        </section>
      </div>
    </aside>
  </div>
</div>

<canvas id="fireworks" aria-hidden="true"></canvas>
<script>
/* Fireworks, launched by the crossword when it is solved */
(function () {
  var cv = document.getElementById('fireworks'), ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var W = 0, H = 0, dpr = 1, rockets = [], sparks = [], raf = 0, last = 0, endAt = 0, nextAt = 0;
  var COLORS = ['#FF4D5E', '#FFC83D', '#4DB8FF', '#5CE08A', '#FF7AD9', '#FFFFFF', '#FF9A3D', '#B58CFF'];
  function fit() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = document.documentElement.clientWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  function launch() {
    var x = W * (0.08 + Math.random() * 0.84);
    rockets.push({ x: x, y: H + 10, ty: H * (0.1 + Math.random() * 0.4), vy: -(420 + Math.random() * 160), c: COLORS[(Math.random() * COLORS.length) | 0] });
  }
  function burst(x, y, c) {
    var n = 70 + ((Math.random() * 40) | 0), c2 = COLORS[(Math.random() * COLORS.length) | 0], sp = 90 + Math.random() * 110;
    for (var i = 0; i < n; i++) {
      var a = Math.PI * 2 * i / n + Math.random() * 0.15, v = sp * (0.55 + Math.random() * 0.45);
      sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 1.3 + Math.random() * 0.9, c: i % 3 ? c : c2 });
    }
  }
  function frame(ts) {
    raf = requestAnimationFrame(frame);
    var dt = Math.min((ts - last) / 1000, 0.05); last = ts;
    if (ts < endAt && ts > nextAt) { launch(); if (Math.random() < 0.4) launch(); nextAt = ts + 350 + Math.random() * 450; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var i, r, s;
    for (i = rockets.length - 1; i >= 0; i--) {
      r = rockets[i]; r.y += r.vy * dt; r.vy += 160 * dt;
      ctx.fillStyle = '#FFF3C4'; ctx.shadowColor = r.c; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(r.x, r.y, 2, 0, 6.2832); ctx.fill();
      if (r.y <= r.ty || r.vy > -40) { burst(r.x, r.y, r.c); rockets.splice(i, 1); }
    }
    for (i = sparks.length - 1; i >= 0; i--) {
      s = sparks[i]; s.life += dt;
      if (s.life > s.max) { sparks.splice(i, 1); continue; }
      s.vx *= 0.985; s.vy = s.vy * 0.985 + 70 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      ctx.globalAlpha = Math.max(0, 1 - s.life / s.max);
      ctx.fillStyle = s.c; ctx.shadowColor = s.c; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    if (ts > endAt && !rockets.length && !sparks.length) {
      cancelAnimationFrame(raf); raf = 0;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    }
  }
  window.__fireworks = function () {
    if (reduce.matches) return;
    fit();
    var now = performance.now();
    endAt = now + 12000; nextAt = now;
    if (!raf) { last = now; raf = requestAnimationFrame(frame); }
  };
  window.addEventListener('resize', fit);
  fit();
})();
</script>
<canvas id="snow" aria-hidden="true"></canvas>
<script>
/* Gentle falling snow */
(function () {
  var cv = document.getElementById('snow'), ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var W = 0, H = 0, dpr = 1, flakes = [], raf = 0, last = 0, edge = 'rgba(80,100,150,0.5)';
  function seed() {
    var n = Math.max(40, Math.min(110, Math.round(W * H / 14000)));
    flakes = [];
    for (var i = 0; i < n; i++) {
      flakes.push({ x: Math.random() * W, y: Math.random() * H, r: 1.2 + Math.random() * 2.6,
        v: 16 + Math.random() * 26, ph: Math.random() * 6.28, sw: 8 + Math.random() * 18, f: 0.3 + Math.random() * 0.6 });
    }
  }
  function fit() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = document.documentElement.clientWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    try { edge = getComputedStyle(document.documentElement).getPropertyValue('--panel-line').trim() || edge; } catch (e) {}
    seed(); draw(0);
  }
  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.shadowColor = edge; ctx.shadowBlur = 3;
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i], x = f.x + Math.sin(t * f.f + f.ph) * f.sw;
      ctx.globalAlpha = 0.55 + f.r / 8;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(x, f.y, f.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  var clock = 0;
  function loop(ts) {
    raf = requestAnimationFrame(loop);
    var dt = Math.min((ts - last) / 1000, 0.1); last = ts; clock += dt;
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i]; f.y += f.v * dt;
      if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
    }
    draw(clock);
  }
  function start() {
    cancelAnimationFrame(raf);
    if (reduce.matches) { draw(0); return; }
    last = performance.now(); raf = requestAnimationFrame(loop);
  }
  fit(); start();
  window.addEventListener('resize', fit);
  if (reduce.addEventListener) reduce.addEventListener('change', start);
  var again = function () { fit(); };
  new MutationObserver(again).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  var dm = window.matchMedia('(prefers-color-scheme: dark)');
  if (dm.addEventListener) dm.addEventListener('change', again);
})();
</script>
